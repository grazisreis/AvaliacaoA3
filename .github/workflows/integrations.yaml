name: Integration Tests

on:
  push:
    branches: [ master, grazidev, rosana, Evely, caio, vicc, frontend ]
  pull_request:
    branches: [ master ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: senha
          MYSQL_DATABASE: clinica_rosa_beauty
          MYSQL_USER: dev_clinica
          MYSQL_PASSWORD: senha
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Run integration tests
        working-directory: ./schedule
        run: mvn -B clean verify -Dspring.profiles.active=integration
